name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  image:
    name: PR image validation (${{ matrix.arch }})
    needs: quality
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Capture build date
        id: build-date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: steam-bee:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: steam-bee:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Smoke-test image
        run: sh scripts/smoke-test-image.sh steam-bee:ci steam-bee-ci

      - name: Verify crash and OOM recovery
        run: node scripts/test-crash-recovery.mjs steam-bee:ci

  image-gate:
    name: PR image validation
    needs: image
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful image validation on every architecture
        env:
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          if [ "$IMAGE_RESULT" != "success" ]; then
            echo "Image validation did not succeed on every architecture: $IMAGE_RESULT" >&2
            exit 1
          fi

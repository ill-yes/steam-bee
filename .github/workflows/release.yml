name: Release
run-name: ${{ format('Release {0} from main', inputs.bump) }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment from the latest stable GitHub Release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-stable
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      status: ${{ steps.final-status.outputs.status }}
      version: ${{ steps.release-plan.outputs.version }}
      tag: ${{ steps.release-plan.outputs.tag }}
      source_commit: ${{ steps.release-plan.outputs.source_commit }}
      release_exists: ${{ steps.release-plan.outputs.release_exists }}
      build_date: ${{ steps.release-plan.outputs.build_date }}
    steps:
      - name: Checkout release workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release plan
        id: release-plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: node scripts/plan-release.mjs

      - name: Set up Docker Buildx for completed-release verification
        if: steps.release-plan.outputs.status == 'complete'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Verify completed release image
        id: final-status
        env:
          PLANNED_STATUS: ${{ steps.release-plan.outputs.status }}
          RELEASE_VERSION: ${{ steps.release-plan.outputs.version }}
        run: |
          STATUS="$PLANNED_STATUS"
          if [ "$STATUS" = "complete" ]; then
            IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_VERSION}"
            if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
              echo "Release ${RELEASE_VERSION} and its image already exist; nothing to do."
            else
              echo "Release ${RELEASE_VERSION} exists without its image; repairing it."
              STATUS="resume"
            fi
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality gate
    needs: plan
    if: needs.plan.outputs.status != 'complete'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout release workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout validated release source
        env:
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
        run: |
          if ! printf '%s' "$SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Release source is not a full Git SHA." >&2
            exit 1
          fi
          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main; then
            echo "$SOURCE_COMMIT is not reachable from main." >&2
            exit 1
          fi
          git checkout --detach "$SOURCE_COMMIT"

      - name: Run shared quality checks
        uses: ./.github/actions/quality

  image-validation:
    name: Release image validation
    needs: [plan, quality]
    if: needs.plan.outputs.status != 'complete'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout release workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout validated release source
        env:
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
        run: |
          if ! printf '%s' "$SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Release source is not a full Git SHA." >&2
            exit 1
          fi
          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main; then
            echo "$SOURCE_COMMIT is not reachable from main." >&2
            exit 1
          fi
          git checkout --detach "$SOURCE_COMMIT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build amd64 smoke image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: steam-bee:release-smoke
          cache-from: type=gha
          build-args: |
            VERSION=${{ needs.plan.outputs.version }}
            REVISION=${{ needs.plan.outputs.source_commit }}
            BUILD_DATE=${{ needs.plan.outputs.build_date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: steam-bee:release-smoke
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Smoke-test amd64 image
        run: sh scripts/smoke-test-image.sh steam-bee:release-smoke steam-bee-release-smoke

  reserve-tag:
    name: Reserve immutable release tag
    needs: [plan, image-validation]
    if: needs.plan.outputs.status != 'complete'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create or verify release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Release tag is not stable semver." >&2
            exit 1
          fi
          if ! printf '%s' "$SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Release source is not a full Git SHA." >&2
            exit 1
          fi

          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main; then
            echo "$SOURCE_COMMIT is not reachable from main." >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$TAG_COMMIT" != "$SOURCE_COMMIT" ]; then
              echo "$RELEASE_TAG already points to $TAG_COMMIT, not $SOURCE_COMMIT." >&2
              exit 1
            fi
            echo "$RELEASE_TAG already reserves $SOURCE_COMMIT."
            exit 0
          fi

          TAG_OBJECT_SHA="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="$RELEASE_TAG" \
              -f message="SteamBee ${RELEASE_VERSION}" \
              -f object="$SOURCE_COMMIT" \
              -f type=commit \
              --jq .sha
          )"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$TAG_OBJECT_SHA" >/dev/null

  publish:
    name: Publish release image
    needs: [plan, reserve-tag]
    if: needs.plan.outputs.status != 'complete'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout release workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable release tag
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Release tag is not stable semver." >&2
            exit 1
          fi
          if ! printf '%s' "$SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Release source is not a full Git SHA." >&2
            exit 1
          fi
          git fetch --force --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$TAG_COMMIT" != "$SOURCE_COMMIT" ]; then
            echo "$RELEASE_TAG points to $TAG_COMMIT, not $SOURCE_COMMIT." >&2
            exit 1
          fi
          git checkout --detach "$SOURCE_COMMIT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=SteamBee
            org.opencontainers.image.description=Self-hosted operations console for managing your own Steam accounts.
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          tags: |
            type=raw,value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }}
            type=raw,value=latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.plan.outputs.version }}
            REVISION=${{ needs.plan.outputs.source_commit }}
            BUILD_DATE=${{ needs.plan.outputs.build_date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: true
          sbom: true

      - name: Verify published platforms
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_VERSION}"
          docker buildx imagetools inspect --raw "$IMAGE" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              const manifest = JSON.parse(input);
              const platforms = new Set(
                (manifest.manifests || []).map(
                  (entry) =>
                    String(entry.platform?.os) +
                    "/" +
                    String(entry.platform?.architecture),
                ),
              );
              for (const required of ["linux/amd64", "linux/arm64"]) {
                if (!platforms.has(required)) {
                  throw new Error("Published image is missing " + required + ".");
                }
              }
            });
          '

      - name: Attest image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  github-release:
    name: Publish GitHub release
    needs: [plan, publish]
    if: needs.plan.outputs.status != 'complete' && needs.plan.outputs.release_exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish release from immutable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: >-
          gh release create "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "SteamBee ${RELEASE_VERSION}"

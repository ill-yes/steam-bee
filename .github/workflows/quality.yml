name: Quality Gate

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit or tag ref to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Validate source Compose file
        run: docker compose config --quiet

      - name: Validate image Compose file
        run: docker compose -f compose.image.yml config --quiet

      - name: Check Compose runtime parity
        run: pnpm compose:check

      - name: Validate Unraid template runtime
        run: pnpm unraid:check

      - name: Dependency review
        if: github.event_name == 'pull_request'
        continue-on-error: ${{ github.event.repository.private }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

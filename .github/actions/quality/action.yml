name: Run quality gate
description: Run the shared SteamBee source quality checks

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.1

    - name: Enable Corepack
      shell: bash
      run: npm install --global corepack@0.36.0 && corepack enable

    - name: Restore pnpm cache
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.1
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          pnpm-workspace.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Audit dependencies
      shell: bash
      run: pnpm audit --audit-level=high

    - name: Check formatting
      shell: bash
      run: pnpm format:check

    - name: Typecheck
      shell: bash
      run: pnpm check

    - name: Test
      shell: bash
      run: pnpm test

    - name: Validate source Compose file
      shell: bash
      run: docker compose config --quiet

    - name: Validate image Compose file
      shell: bash
      run: docker compose -f compose.image.yml config --quiet

    - name: Check Compose runtime parity
      shell: bash
      run: pnpm compose:check

    - name: Validate Unraid template runtime
      shell: bash
      run: pnpm unraid:check

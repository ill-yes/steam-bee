packages:
  - apps/*
  - packages/*
# Corepack verifies the integrity-pinned pnpm version. CI, Docker and preinstall
# enforce it explicitly while keeping a GitHub-readable project lockfile.
pmOnFail: ignore
patchedDependencies:
  picomatch@4.0.7: patches/picomatch@4.0.7.patch
  steam-user@5.3.0: patches/steam-user@5.3.0.patch
# The local picomatch patch rejects repeated extglobs. CI verifies the patch
# before auditing; remove this exception together with the patch after a
# verified upstream repair. See SECURITY.md.
audit:
  ignore:
    - GHSA-fc5q-39xc-vjpf
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyExclude:
  - "pino@9.14.0"
  - "semver@6.3.1"
  - "undici-types@6.21.0"
blockExoticSubdeps: true
overrides:
  "fast-uri@3": 3.1.9
  "browserslist@4": 4.29.4
  "brace-expansion@5": 5.0.12
  "ip-address@10": 10.7.4
  "nanoid@3": 3.3.20
  "postcss@8": 8.5.31
  protobufjs: 7.6.6
  "source-map-js@1": 1.2.2
  "steam-user@5.3.0>adm-zip": 0.6.1
allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: true

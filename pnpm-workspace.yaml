packages:
  - apps/*
  - packages/*
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyExclude:
  - "pino@9.14.0"
  - "semver@6.3.1"
  - "undici-types@6.21.0"
blockExoticSubdeps: true
overrides:
  protobufjs: 7.6.5
  "steam-user@5.3.0>adm-zip": 0.6.0
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - protobufjs
allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: true
